# Configuration for the full library design, 2026-2027 season.
# See the equivalent file in flu-seqneut-2026 for a worked example of every option.

subtypes: [H3N2, H1N1]

# When true, read committed frozen copies from `frozen_genbank_match_dir` (one
# `{subtype}.csv` per subtype) instead of querying NCBI, so accessions cannot
# drift between runs. To refresh: set false, run, copy the regenerated
# results/genbank_match/{subtype}/match_prot_to_genbank_nt.csv files in as
# `{subtype}.csv`, commit, then set true again.
freeze_genbank_match: true
frozen_genbank_match_dir: data/frozen_genbank_match

# TSVs of recent HA protein haplotypes. Required columns (extras are ignored):
#  - count: recent sequence count for haplotype
#  - derived_haplotype: subclade + mutations
#  - representative_strain: strain representing the haplotype
#  - representative_strain_ha1_sequence: HA1 protein sequence
#  - representative_ha2_sequence: HA2 protein sequence (note asymmetric naming vs HA1)
recent_haplotypes:
  H3N2: data/2027-Feb-VCM-seqneut-library-strain-selection-H3N2.tsv
  H1N1: data/2027-Feb-VCM-seqneut-library-strain-selection-H1N1.tsv

# Plain-text files (one haplotype per line) of recent haplotypes to select
select_recent_haplotype_files:
  H3N2:
    - data/barri_h3n2.txt
    - data/huddlej_h3n2.txt
  H1N1:
    - data/barri_h1n1pdm.txt
    - data/huddlej_h1n1pdm.txt

# Manual exclusions, as names from the derived_haplotype column. Annotate each
# entry with why it is excluded.
override_select_recent_haplotypes:
  H3N2:
    # Representative strain A/Colombia/ANT-LDSP17095/2026 has an ambiguous HA1
    # residue (X) at position 159. Re-added with N, the K clade consensus there,
    # via manually_fixed_recent_H3N2_haplotypes.tsv below.
    - K:N94S,S156G,K160A,V223I
  H1N1:

# Additional haplotypes to include, e.g. older strains or manually fixed
# haplotypes whose ambiguous/missing residues have been resolved.
additional_haplotypes:
  H3N2:
    - data/manually_fixed_recent_H3N2_haplotypes.tsv
  H1N1: []

# GFF files interconverting sequential and HA1 / HA2 numbering
gffs:
  H3N2: https://raw.githubusercontent.com/nextstrain/seasonal-flu/refs/heads/master/config/h3n2/ha/genemap.gff
  H1N1: https://raw.githubusercontent.com/nextstrain/seasonal-flu/refs/heads/master/config/h1n1pdm/ha/genemap.gff

# JSONs defining the HA epitope sites
epitope_sites:
  H3N2:
    Wolf: https://raw.githubusercontent.com/nextstrain/seasonal-flu/refs/heads/master/config/distance_maps/h3n2/ha/wolf.json  # https://doi.org/10.1186/1745-6150-1-34
    Koel: https://raw.githubusercontent.com/nextstrain/seasonal-flu/refs/heads/master/config/distance_maps/h3n2/ha/koel.json  # https://doi.org/10.1126/science.1244730
  H1N1:
    Caton: https://raw.githubusercontent.com/nextstrain/seasonal-flu/refs/heads/master/config/distance_maps/h1n1pdm/ha/canton.json  # https://doi.org/10.1016/0092-8674(82)90135-0

# Protein-based Nextstrain trees. Columns named under `color_by_metadata` must
# exist in the recent-haplotypes TSVs. See
# https://github.com/jbloomlab/nextstrain-prot-titers-tree for documentation.
nextstrain_tree:
  H3N2:
    outgroup: data/H3N2_outgroup.fa
    color_by_metadata:
      selected_haplotype: {}
      hamming_distance_nearest_library_strain_ha1_ha2: {scale_type: viridis_linear}
      Koel_epitope_distance: {scale_type: viridis_linear}
      Wolf_epitope_distance: {scale_type: viridis_linear}
      count: {scale_type: viridis_log}
      days_since_latest_sequence: {scale_type: viridis_linear}
      relative_fitness_derived_haplotype: {scale_type: viridis_linear}
    display_defaults: {color_by: selected_haplotype, distance_measure: div, branch_label: aa}
    addtl_export_args: {title: H3N2 HAs selected for library}
  H1N1:
    outgroup: data/H1N1_outgroup.fa
    color_by_metadata:
      selected_haplotype: {}
      hamming_distance_nearest_library_strain_ha1_ha2: {scale_type: viridis_linear}
      Caton_epitope_distance: {scale_type: viridis_linear}
      count: {scale_type: viridis_log}
      days_since_latest_sequence: {scale_type: viridis_linear}
      relative_fitness_derived_haplotype: {scale_type: viridis_linear}
    display_defaults: {color_by: selected_haplotype, distance_measure: div, branch_label: aa}
    addtl_export_args: {title: H1N1 HAs selected for library}
